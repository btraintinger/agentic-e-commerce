services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
      POSTGRES_DB: webshop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webshop -d webshop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
